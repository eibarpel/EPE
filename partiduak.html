<!DOCTYPE html>
<html>
<head>
  <title>Eibar K.D. Pelotarixak</title>

  <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #3b6657;
        color: white;
    }
    
    h1 {
      font-weight: bold;
      font-size: 1.5em;
    }
    
    h2 {
      font-weight: bold;
      font-size: 1em;
      text-align: left;
      margin-left: 80px;
    }   
    
    .container0 {
      display: flex;
      height:25px;
      margin-top: 0px;
      gap: 0px;
      margin-left: 60px;
      margin-right: 60px;
      background:#3b6657;
      z-index: 10;
      border: 0px solid red;
   }
    
    .container1 {
      display: flex;
      gap: 0px;
      margin-left: 60px;
      margin-right: 60px;
      border: 0px solid black;
      overflow: hidden;
      position: relative; /* Establece la referencia para posicionar container2 */
    }
    
    .container11 {
      width: 200px;
      border: none;
      height: 390px;
      margin-top: -30px;
      background:#3b6657;
      overflow-y: hidden;
      border: 0px solid white;
     }
    
    .container12 {
      flex: 1; /* ocupa el resto del espacio */
      border: none;
      height: 412px;
      margin-top: -30px;
      background:#3b6657;
      overflow-y: hidden;
      border: 0px solid red;
    }
    
    .container21 {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 200px;         /* Ancho del primer iframe */
      height: 40px;         /* Altura exacta para cubrir la barra con A y B */
      background: #3b6657; /* Mismo color verde de fondo */
      z-index: 9999;       /* Obliga a posicionarse por encima de los iframes */
      border: 0px solid blue;
      box-sizing: border-box;
   }    

  </style>
</head>

<body>
  <h1>Eibar K.D. - 2026/27 Denboraldiko Partiduak 1</h1> 
  
  <div style="height:10px;">&nbsp;</div>
   
  <div class="container0"> </div>
  
  <div class="container1">
    <iframe 
      class="container11"
      scrolling="no"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSAE6H3d3LbUIXEfZ8_cdnKQ6AU6jE8nDmtdPJwgrVNAYXnjWTSOwUxO40BNlg9nbm_7VdSrkBRqj1i/pubhtml?gid=1506814058&widget=true">
    </iframe>
    
    <iframe 
      class="container12"
      scrolling="no"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSAE6H3d3LbUIXEfZ8_cdnKQ6AU6jE8nDmtdPJwgrVNAYXnjWTSOwUxO40BNlg9nbm_7VdSrkBRqj1i/pubhtml?gid=91329535&widget=true">
    </iframe>

    <!-- El bloque container2 se coloca AQUÍ dentro para solaparse correctamente -->
    <div class="container21"></div>
  </div>

</body>
</html>
