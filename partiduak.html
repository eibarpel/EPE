<!DOCTYPE html>
<html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Eibar K.D. Pelotarixak</title>
      <style>
          body {
              font-family: Arial, sans-serif;
              text-align: center;
              margin: 0;
              padding-top: 30px;
              background-color: #3b6657;
              color: white;
          }

          /* Contenedor principal flex */
          .container1 {
              display: flex;
              justify-content: center;
              align-items: flex-start;
              margin: 0 auto;
              max-width: 98%;
          }

          /* Contenedores para recortar la barra de título superior de Google Sheets */
          .iframe-wrapper-left {
              width: 260px;
              height: 350px;
              overflow: hidden;
              position: relative;
          }

          .iframe-wrapper-right {
              flex: 1;
              height: 350px;
              overflow: hidden;
              position: relative;
          }

          /* Los iframes se desplazan ligeramente hacia arriba para ocultar el título superior */
          .iframe-wrapper-left iframe,
          .iframe-wrapper-right iframe {
              width: 100%;
              height: calc(100% + 35px); /* Compensación de la barra superior */
              margin-top: -35px; /* Sube la tabla para tapar el título "Partiduak_..." */
              border: none;
          }
      </style>
  </head>
  <body>

    <div class="container1">
        <!-- Columna 1: Pilotariak -->
        <div class="iframe-wrapper-left">
            <iframe 
              src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSxtxnQvmD3WD2aproMc5mndxcRtn-jZAt3G4LVFiVfd7w_gv0Ik9mMofnE48eztNmDcw3jH6GnOsau/pubhtml?gid=1506814058&amp;single=true&amp;widget=false&amp;chrome=false">
            </iframe>
        </div>

        <!-- Columna 2: Partiduak -->
        <div class="iframe-wrapper-right">
            <iframe 
              src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSxtxnQvmD3WD2aproMc5mndxcRtn-jZAt3G4LVFiVfd7w_gv0Ik9mMofnE48eztNmDcw3jH6GnOsau/pubhtml?gid=91329535&amp;single=true&amp;widget=false&amp;chrome=false">
            </iframe>
        </div>
    </div>

  </body>
</html>
