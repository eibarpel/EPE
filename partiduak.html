<!DOCTYPE html>
<html>
<head>
  <title>Eibar K.D. Pelotarixak</title>

  <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #3b6657;
        color: white;
        margin: 0;
        padding: 0;
    }
    
    h1 {
      font-weight: bold;
      font-size: 1.2em;
      margin: 10px 0;
    }
    
    /* Estilos para la botonera */
    .scroll-controls {
      margin: 8px 0;
    }

    .scroll-btn {
      background-color: #27443a;
      color: white;
      border: 1px solid #528c78;
      padding: 6px 14px;
      margin: 0 5px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .scroll-btn:hover {
      background-color: #528c78;
    }
    
    .container0 {
      display: flex;
      height: 25px;
      margin-left: 60px;
      margin-right: 60px;
      background: #3b6657;
      z-index: 10;
   }
    
    .container1 {
      display: flex;
      gap: 0px;
      margin-left: 60px;
      margin-right: 60px;
      overflow-y: hidden;
    }
    
    .container11 {
      width: 200px;
      height: 588px;
      margin-top: -30px;
      background: #3b6657;
      overflow-y: hidden;
      border: none;
     }
    
    .container12 {
      flex: 1; /* ocupa el resto del espacio */
      height: 588px;
      margin-top: -30px;
      background: #3b6657;
      overflow-y: hidden;
      border: none;
    }

    .container2 {
      display: flex;
      height: 30px;
      margin-left: 60px;
      margin-right: 60px;
      margin-top: -30px; 
      background: #3b6657;
      position: relative;
    }   
  </style>
</head>

<body>
  <div style="height:5px;">&nbsp;</div>
  <h1>Eibar K.D. - 2026/27 Denboraldiko Partiduak</h1> 
  
  <!-- Botones para controlar el scroll horizontal -->
  <div class="scroll-controls">
    <button class="scroll-btn" onclick="moverScroll('izquierda')">◀ Ir al inicio</button>
    <button class="scroll-btn" onclick="moverScroll('derecha')">Ir al final ▶</button>
  </div>
   
  <div class="container0"></div>
  <div class="container1">
    <iframe 
      class="container11"
      scrolling="no"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSAE6H3d3LbUIXEfZ8_cdnKQ6AU6jE8nDmtdPJwgrVNAYXnjWTSOwUxO40BNlg9nbm_7VdSrkBRqj1i/pubhtml?gid=1506814058&widget=true">
    </iframe>
    
    <iframe 
      id="tablaCalendario"
      class="container12"
      scrolling="no"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSAE6H3d3LbUIXEfZ8_cdnKQ6AU6jE8nDmtdPJwgrVNAYXnjWTSOwUxO40BNlg9nbm_7VdSrkBRqj1i/pubhtml?gid=91329535&widget=true">
    </iframe>
  </div>
  
  <div class="container2"></div>

  <script>
    function moverScroll(direccion) {
      const iframe = document.getElementById('tablaCalendario');
      try {
        // Intentamos acceder al documento interno del iframe
        const docIframe = iframe.contentDocument || iframe.contentWindow.document;
        // Buscamos el contenedor principal de la tabla de Google Sheets
        const contenido = docIframe.querySelector('.grid-container') || docIframe.body;
        
        if (direccion === 'izquierda') {
          contenido.scrollLeft = 0;
        } else {
          contenido.scrollLeft = contenido.scrollWidth;
        }
      } catch (e) {
        // Si las políticas de seguridad del navegador (CORS) bloquean el acceso al DOM del iframe,
        // una alternativa es recargar o usar métodos de desplazamiento estándar.
        console.log("Acceso restringido al DOM del iframe por políticas de seguridad.");
      }
    }
  </script>
</body>
</html>
