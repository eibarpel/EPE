<!DOCTYPE html>
<html>
<head>
  <title>Eibar K.D. Pelotarixak</title>

  <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #3b6657;
        color: white;
    }
    
    h1 {
      font-weight: bold;
      font-size: 1.5em;
    }
    
    h2 {
      font-weight: bold;
      font-size: 1em;
      text-align: left;
      margin-left: 80px;
    }   
   .container0 {
      display: flex;
      height:25px;
      margin-top: 0px;
      gap: 0px;
      margin-left: 60px;
      margin-right: 60px;
      background:#3b6657;
      z-index: 10;
      border: none;
   }
     
    
    .container1 {
      display: flex;
      gap: 0px;
      margin-left: 60px;
      margin-right: 60px;
      border: none;
      overflow-y: hidden;
    }
    
    .container11 {
      width: 200px;
      border: none;
      height: 390px;
      margin-top: -30px;
      background:#3b6657;
      overflow-y: hidden;
     }
    
    .container12 {
      
      width: 2500px;
      border: none;
      height: 390px;
      margin-top: -30px;
      background:#3b6657;
      overflow-y: hidden;
    }
    
    .wrapper-scroll {
      flex: 1;
      height: 410px;
      margin-top: -30px;
      background: #3b6657;
      overflow-x: auto; /* Permite scroll horizontal */
      overflow-y: hidden;
    }
    
    .container2 {
      display: flex;
      height:30px;
      gap: 0px;
      margin-left: 60px;
      margin-right: 60px;
      margin-top: -30px; 
      background:#3b6657;
      z-index: 10;
      border: none;
      position:relative;
    }    
    
    .footer-container {
      max-width: 1100px;
      margin-left: 80px;
      text-align: left; /* Alinea la imagen a la izquierda */
    }

    /* Imagen con mayor tamaño */
    .adibide-icon {
      width: 100%;
      max-width: 350px; /* Aumentado de tamaño */
      height: auto;
      display: block;
    }

  </style>
</head>

<body onload="posicionarScroll()">
  <h1>Eibar K.D. - 2026/27 Denboraldiko Partiduak</h1> 
  
  <div style="height:10px;">&nbsp;</div>
   
  <div class="container0"> </div>
  <div class="container1">
    <iframe 
      class="container11"
      scrolling="no"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSxtxnQvmD3WD2aproMc5mndxcRtn-jZAt3G4LVFiVfd7w_gv0Ik9mMofnE48eztNmDcw3jH6GnOsau/pubhtml?gid=1506814058&widget=true">
    </iframe>
      
    <div class="wrapper-scroll" id="scrollWrapper">
      <iframe 
        class="container12"
        scrolling="no"
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSxtxnQvmD3WD2aproMc5mndxcRtn-jZAt3G4LVFiVfd7w_gv0Ik9mMofnE48eztNmDcw3jH6GnOsau/pubhtml?gid=91329535&widget=true">
      </iframe>
    </div>
  </div>
  
  <div class="container2"> </div>

  <!--h2>Adibidez</h2> 
  <div class="footer-container">
    <img class="adibide-icon" src="https://lh3.googleusercontent.com/d/1mEPQYQwpEM-TbgupSWMN9q-fv-rtxNZS" alt="Leyenda">
   </div-->
<script>
    function posicionarScroll() {
      // Alert de prueba para verificar que el evento se dispara
      alert("¡El evento onload del body se ha disparado!");
      const wrapper = document.querySelector('.wrapper-scroll');

      if (wrapper) {
        alert("wrapper-scroll");
        const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
        alert(maxScroll);
        // Ahora maxScroll dará un valor mayor a 0
        wrapper.scrollLeft = maxScroll * 0.65;
      }
      
      
    }
  </script>

  
</body>
</html>
